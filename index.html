function employeeTable(){let[a,b]=periodBounds(),q=employeeQuery.toLowerCase().trim();return `<div class="table-scroll"><table><thead><tr><th>Employee</th><th>Live activity</th><th>Days worked</th><th>Clocked hours</th><th>Working / idle</th><th></th></tr></thead><tbody>${state.employees.filter(e=>(employeeStatusFilter==='all'||(employeeStatusFilter==='active'?e.active:!e.active))&&[e.name,e.code,e.team,e.email].join(' ').toLowerCase().includes(q)).map(e=>{let m=activityMetrics(e.id,a,b);return `<tr><td><div class="flex"><span class="avatar">${esc(e.name.slice(0,2).toUpperCase())}</span><div><button class="text-link" onclick="openEmployee('${e.id}')">${esc(e.name)}</button><div class="sub">${esc(e.code)} · ${esc(e.team)}</div></div></div></td><td>${employeeBadge(e)}<div class="sub">${employeeSession(e.id)?esc(project(employeeSession(e.id).project)?.name||'No project'):'No open session'}</div></td><td>${m.days}</td><td>${m.total.toFixed(2)} h</td><td><span class="text-green">${m.working.toFixed(2)} h</span> / <span style="color:var(--amber)">${m.idle.toFixed(2)} h</span>${m.unknown?'<div class="sub">'+m.unknown.toFixed(2)+' h without activity data</div>':''}</td><td><button class="btn sm" onclick="openEmployee('${e.id}')">View employee ${icon('arrow')}</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No matching employees.</td></tr>'}</tbody></table></div>`}
function openEmployee(id){selectedEmployee=id;employeeTab='work';go('employee')}
function employeeProfile(){let e=employeeById(selectedEmployee);if(!e)return employeeManagement();let[a,b]=periodBounds(),m=activityMetrics(e.id,a,b),session=employeeSession(e.id),captures=periodCaptures(e.id);return title(e.code+' · '+e.team,esc(e.name),'Employee record · '+esc(e.email||'No email added'),`<button class="btn" onclick="go('employees')">${icon('back')}Employees</button>${e.active?`<button class="btn danger" onclick="removeEmployeeDialog('${e.id}')">Remove employee</button>`:pill('Removed · history retained')}`)+`<div class="employee-summary card"><div class="flex wrap between"><div class="flex"><div class="avatar large">${esc(e.name.slice(0,2).toUpperCase())}</div><div>${employeeBadge(e)}<p style="margin-top:7px">${session?esc(project(session.project)?.name||'No project')+' · <b data-clock="'+session.start+'"></b> in current session':'No open work session'}</p><small>Activity shown here is simulated for the presentation.</small></div></div>${periodControls()}</div></div><div class="stats employee-stats">${stat('Days worked',m.days,periodTitle(),'attendance')}${stat('Clocked time',m.total.toFixed(2)+' h','Total session time in this period','reports')}${stat('Working time',m.working.toFixed(2)+' h','Recorded working activity segments','dashboard')}${stat('Idle time',m.idle.toFixed(2)+' h','Included in clocked time','attendance')}</div><div class="tabs" role="tablist">${[['work','Work & projects'],['screenshots','Screenshots · '+captures.length]].map(([id,label])=>`<button role="tab" aria-selected="${employeeTab===id}" class="${employeeTab===id?'active':''}" onclick="employeeTab='${id}';render()">${label}</button>`).join('')}</div>${employeeTab==='screenshots'?screenshotHistory(e):employeeWork(e,m,a,b)}${e.active?`<details class="card demo-controls"><summary>Demo controls · simulate employee events</summary><p class="muted" style="margin:12px 0">These controls stand in for the employee desktop app during your presentation. No employee-facing dashboard or background screen capture is included.</p><div class="flex wrap"><button class="btn" onclick="employeeClockDialog('${e.id}')">${session?'Simulate clock out':'Simulate clock in'}</button>${session?`<button class="btn" onclick="toggleEmployeeActivity('${e.id}')">${activityAt(session)==='idle'?'Simulate resume':'Simulate idle'}</button><button class="btn" ${!state.capturePolicy.enabled?'disabled':''} onclick="generateSampleCapture('${e.id}')">Generate sample capture</button>`:''}</div></details>`:''}<div class="spacer"></div><div class="explain"><b>Reading this record</b><p>Days worked count distinct dates with recorded clock time. Working + idle + unknown activity equals clocked time. Idle status describes an input-activity signal; it is not a productivity score. Removed employees retain their past sessions and captures.</p></div>`}
function employeeWork(e,m,a,b){let ps=[...new Set(m.sessions.map(s=>s.project))],assigned=state.projects.filter(p=>p.stage>0&&p.stage<5&&p.assignees?.[TEAMS[p.stage-1]]===e.id);return `${workPeriod==='month'?workCalendar(e):''}<div class="columns"><div class="card"><div class="card-head"><h2>Projects worked on</h2><small>${periodTitle()}</small></div>${ps.map(id=>{let sessions=m.sessions.filter(s=>s.project===id),hours=sessions.reduce((n,s)=>n+sessionHours(s,a,b),0),p=project(id);return `<div class="project-work-row"><div class="grow"><button class="text-link" onclick="openProject('${id}')">${esc(p?.name||'Unavailable project')}</button><div class="muted">${esc(p?.no||'')} · ${sessions.length} session${sessions.length===1?'':'s'}</div></div><b>${hours.toFixed(2)} h</b></div>`}).join('')||'<div class="empty">No work sessions in this period.</div>'}</div><div class="card"><h2>Current assignments</h2>${assigned.map(p=>`<div class="attention-item"><button class="text-link" onclick="openProject('${p.id}')">${esc(p.name)}</button><p>${STAGES[p.stage]} · Due ${dateLabel(p.due)}</p>${status(p)}</div>`).join('')||'<div class="empty">No active design stages assigned.</div>'}</div></div><div class="spacer"></div><div class="card"><div class="card-head"><h2>Work session history</h2><button class="btn sm" onclick="exportEmployeeReport('${e.id}')">Export this period</button></div>${m.unknown?`<div class="explain">${m.unknown.toFixed(2)} hours have no activity signal. They remain in clocked time and are not assumed to be working or idle.</div>`:''}<div class="table-scroll"><table><thead><tr><th>Date / project</th><th>Clock in</th><th>Clock out</th><th>Hours in period</th><th>Working / idle</th></tr></thead><tbody>${m.sessions.slice().sort((x,y)=>y.start-x.start).map(s=>{let work=0,idle=0;for(const part of s.activity||[]){let h=sessionHours({start:part.start,end:Math.min(part.end??Date.now(),s.end??Date.now())},a,b);if(part.kind==='working')work+=h;if(part.kind==='idle')idle+=h}return `<tr><td><b>${new Date(s.start).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</b><div class="sub">${esc(project(s.project)?.name||'Unavailable project')}</div></td><td>${stamp(s.start)}</td><td>${s.end?stamp(s.end):pill('Open session','green')}</td><td>${sessionHours(s,a,b).toFixed(2)} h</td><td>${work.toFixed(2)} h / ${idle.toFixed(2)} h</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No sessions recorded for this selection.</td></tr>'}</tbody></table></div></div>`}
function workCalendar(e){let[a,b]=periodBounds(),start=new Date(a),days=[],offset=(start.getDay()+6)%7;for(let i=0;i<offset;i++)days.push('<span></span>');for(let d=new Date(a);+d<b;d.setDate(d.getDate()+1)){let day=localDate(d),[x,y]=dayBounds(day),m=activityMetrics(e.id,x,y);days.push(`<button class="calendar-day ${m.total?'worked':''}" onclick="workDate='${day}';workPeriod='day';render()" aria-label="${day}, ${m.total.toFixed(2)} hours"><b>${d.getDate()}</b><small>${m.total?m.total.toFixed(1)+' h':'—'}</small></button>`)}return `<div class="card" style="margin-bottom:22px"><div class="card-head"><h2>Workdays · ${periodTitle()}</h2><small>Select a date for its records</small></div><div class="work-calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<small class="calendar-heading">${d}</small>`).join('')}${days.join('')}</div><p class="metric-note">A blank day means no recorded clock time; it is not automatically marked absent.</p></div>`}
function addEmployeeDialog(){modal('Add an employee',`<form onsubmit="addEmployee(event)"><div class="form-grid"><label>Full name<input name="name" required maxlength="80" autocomplete="off"></label><label>Team<select name="team">${TEAMS.map(t=>`<option>${t}</option>`).join('')}</select></label><label class="full">Email address<input type="email" name="email" required maxlength="160" placeholder="name@company.com"></label></div><div class="explain" style="margin-top:18px">Creates an admin employee record with a unique employee ID. No invitation or message is sent from this demo.</div>${actions('Add employee')}</form>`)}
function addEmployee(event){event.preventDefault();let f=new FormData(event.target),name=f.get('name').trim(),email=f.get('email').trim().toLowerCase(),team=f.get('team');if(!name||!email||!TEAMS.includes(team))return toast('Enter a name, valid email and team.');if(state.employees.some(e=>e.email.toLowerCase()===email||e.name.toLowerCase()===name.toLowerCase()))return toast('That name or email already has an employee record.');let n=Math.max(0,...state.employees.map(e=>Number(e.code.slice(4))||0))+1,e={id:uid(),code:'T3-E'+String(n).padStart(3,'0'),name,email,team,active:true,joined:today()};state.employees.push(e);state.employeeEvents.push({at:Date.now(),employeeId:e.id,action:'Employee added',actor:'Owner'});save();closeModal();openEmployee(e.id);toast('Employee record created. It is ready for work sessions and assignments.')}
function removeEmployeeDialog(id){let e=employeeById(id),assigned=state.projects.filter(p=>p.stage>0&&p.stage<5&&p.assignees?.[TEAMS[p.stage-1]]===id),open=employeeSession(id);modal('Remove '+esc(e.name)+' from the active team',`<div class="explain"><b>Past work stays available.</b><p>The employee is removed from the active directory. Sessions, screenshot history and project records remain visible under Removed employees.${open?' Their open clock session will be closed at removal time.':''}</p></div><form onsubmit="removeEmployee(event,'${id}')">${assigned.length?`<p style="margin-bottom:16px">${assigned.length} current stage${assigned.length===1?' needs':'s need'} a replacement in ${e.team}.</p><label>Reassign current stages<select name="replacement" required>${employeeOptions(e.team,'',e.id)}</select></label>`:''}<label style="margin-top:16px">Removal reason<textarea name="reason" required maxlength="1000" placeholder="e.g. Employee left the company"></textarea></label>${actions('Remove employee')}</form>`)}
function removeEmployee(event,id){event.preventDefault();let e=employeeById(id),f=new FormData(event.target),reason=f.get('reason').trim(),replacement=employeeById(f.get('replacement')),assigned=state.projects.filter(p=>p.stage>0&&p.stage<5&&p.assignees?.[TEAMS[p.stage-1]]===id);if(!e?.active||!reason)return toast('Enter the removal reason.');if(assigned.length&&(!replacement?.active||replacement.id===id||replacement.team!==e.team))return toast('Choose an active replacement from the same team, or add one first.');let session=employeeSession(id);if(session)closeEmployeeSession(session);for(const p of state.projects.filter(p=>p.stage<8)){let changed=false;for(const t of TEAMS)if(p.assignees?.[t]===id){p.assignees[t]=replacement?.id||null;changed=true}if(changed){history(p,'Employee assignment updated',`${e.name} removed. ${replacement?'Reassigned to '+replacement.name+'.':'Future stage will require a new assignee.'}`);if(assigned.includes(p)){let record=p.records.filter(r=>r.stage===p.stage&&r.entered&&!r.completed).at(-1);if(record)record.owner=replacement.name}}}e.active=false;e.removedAt=Date.now();e.removalReason=reason;state.employeeEvents.push({at:Date.now(),employeeId:id,action:'Employee removed',note:reason,actor:'Owner'});save();closeModal();render();toast('Employee removed from the active team. Historical records are retained.')}
function employeeClockDialog(id){let e=employeeById(id),session=employeeSession(id);if(!e?.active)return toast('This employee is no longer active.');modal(session?'Simulate employee clock-out':'Simulate employee clock-in',`<div class="explain">Presentation event for <b>${esc(e.name)}</b>. In production, the employee performs this manually in their own desktop app.</div>${session?`<p>${esc(project(session.project)?.name)} · ${sessionHours(session).toFixed(2)} recorded hours.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="endEmployeeSession('${session.id}')">Confirm clock out</button></div>`:`<form onsubmit="startEmployeeSession(event,'${id}')"><label>Work project<select name="project" required><option value="">Select a project</option>${state.projects.filter(p=>p.stage<8).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>${actions('Start session')}</form>`}`)}
function startEmployeeSession(event,id){event.preventDefault();let e=employeeById(id),p=project(new FormData(event.target).get('project'));if(!e?.active||employeeSession(id))return toast('Employee must be active and clocked out.');if(!p||p.stage===8)return toast('Choose an ongoing project.');let now=Date.now();state.sessions.push({id:uid(),employeeId:id,employee:e.name,project:p.id,start:now,end:null,source:'simulated',activity:[{kind:'working',start:now,end:null}],lastCaptureAt:now});save();closeModal();render();toast('Simulated clock-in recorded. Sample capture scheduling begins now.')}
function closeEmployeeSession(session){let now=Date.now();session.end=now;for(const a of session.activity||[])if(a.end===null)a.end=now}
function endEmployeeSession(id){let session=state.sessions.find(s=>s.id===id);if(!session||session.end!==null)return;closeEmployeeSession(session);save();closeModal();render();toast('Clock-out recorded. No further sample captures will be generated for this session.')}
function toggleEmployeeActivity(id){let e=employeeById(id),s=employeeSession(id);if(!e?.active||!s)return toast('An active clock session is required.');let kind=activityAt(s)==='idle'?'working':'idle',now=Date.now();for(const a of s.activity)if(a.end===null)a.end=now;s.activity.push({kind,start:now,end:null});save();render();toast('Simulated '+kind+' activity recorded in this work session.')}
function captureIntervalLabel(){let n=state.capturePolicy.intervalMinutes;return n%60===0?n/60+' hour'+(n===60?'':'s'):n+' minutes'}
function captureSettingsDialog(){let p=state.capturePolicy,hours=p.intervalMinutes%60===0;modal('Screenshot & activity policy',`<form onsubmit="saveCaptureSettings(event)"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" name="enabled" ${p.enabled?'checked':''}> Enable screenshots while employees are clocked in</label><div class="form-grid" style="margin-top:22px"><label>Capture every<input name="interval" type="number" min="1" max="240" step="1" required value="${hours?p.intervalMinutes/60:p.intervalMinutes}"></label><label>Interval unit<select name="unit"><option value="minutes" ${!hours?'selected':''}>Minutes</option><option value="hours" ${hours?'selected':''}>Hours</option></select></label><label class="full">Idle threshold (minutes without input)<input type="number" name="idle" min="1" max="60" step="1" required value="${p.idleMinutes}"></label></div><div class="explain" style="margin-top:20px"><b>Capture follows the work session.</b><p>Choose an interval from 1 minute to 4 hours. Capture stops on clock-out or employee removal. Changing the interval starts a fresh countdown. Existing screenshots are retained.</p></div><p class="muted">In this preview, the schedule generates labeled sample images while the page is open. The idle threshold is a saved production setting; use the employee’s demo controls to simulate idle/resume events. A separate employee desktop app is required for real, employee-visible capture.</p>${actions('Save policy')}</form>`)}
function saveCaptureSettings(event){event.preventDefault();let f=new FormData(event.target),n=Number(f.get('interval')),minutes=n*(f.get('unit')==='hours'?60:1),idle=Number(f.get('idle'));if(!Number.isInteger(n)||minutes<1||minutes>240||!Number.isInteger(idle)||idle<1||idle>60)return toast('Set an interval of 1–240 minutes and idle threshold of 1–60 minutes.');state.capturePolicy={enabled:f.get('enabled')==='on',intervalMinutes:minutes,idleMinutes:idle};for(const s of state.sessions.filter(s=>s.end===null))s.lastCaptureAt=Date.now();state.employeeEvents.push({at:Date.now(),action:'Capture policy changed',actor:'Owner',note:`${state.capturePolicy.enabled?'Enabled':'Paused'}; every ${minutes} min; idle threshold ${idle} min.`});save();closeModal();render();toast('Screenshot policy saved. The new interval applies to open and future sessions.')}
function periodCaptures(id){let[a,b]=periodBounds();return state.captures.filter(c=>c.employeeId===id&&c.at>=a&&c.at<b).sort((x,y)=>y.at-x.at)}
function sampleCaptureImage(c){let p=project(c.project),name=esc(p?.name||'Project review');let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" fill="#f0f2ed"/><rect width="1000" height="42" fill="#20332b"/><text x="22" y="27" font-family="Arial" font-size="15" fill="#eef3e7">TEAM3 · Drawing review workspace</text><rect y="42" width="1000" height="46" fill="#fff"/><text x="25" y="70" font-family="Arial" font-size="14" fill="#415341">File　 View　 Layers　 Measure　 Annotate</text><rect y="88" width="185" height="485" fill="#e5eade"/><text x="18" y="122" font-family="Arial" font-size="13" fill="#53654b">PROJECT LAYERS</text><text x="18" y="163" font-family="Arial" font-size="14" fill="#304231">☑ Furniture layout</text><text x="18" y="198" font-family="Arial" font-size="14" fill="#304231">☑ Dimensions</text><text x="18" y="233" font-family="Arial" font-size="14" fill="#304231">☑ Lighting points</text><text x="220" y="123" font-family="Arial" font-size="20" fill="#233b2b">${name}</text><text x="220" y="149" font-family="Arial" font-size="13" fill="#677560">Illustrative floor layout · review sheet 01</text><rect x="270" y="185" width="615" height="325" fill="#fff" stroke="#60715a" stroke-width="4"/><path d="M600 185v190 M600 430v80 M270 350h200 M520 350h365 M730 350v160" fill="none" stroke="#60715a" stroke-width="4"/><rect x="310" y="230" width="100" height="55" fill="#e5ecd8" stroke="#789268"/><rect x="315" y="400" width="140" height="55" fill="#e5ecd8" stroke="#789268"/><rect x="650" y="225" width="145" height="70" fill="#e5ecd8" stroke="#789268"/><text x="435" y="283" font-family="Arial" font-size="15" fill="#54674d">LIVING</text><text x="475" y="430" font-family="Arial" font-size="15" fill="#54674d">DINING</text><text x="675" y="322" font-family="Arial" font-size="15" fill="#54674d">BEDROOM</text><text x="748" y="430" font-family="Arial" font-size="15" fill="#54674d">KITCHEN</text><path d="M270 540h615 M270 534v12 M885 534v12" fill="none" stroke="#7e8e71"/><text x="510" y="561" font-family="Arial" font-size="13" fill="#6b7e60">DEMONSTRATION LAYOUT</text><rect y="577" width="1000" height="43" fill="#d6ef8a"/><text x="24" y="604" font-family="Arial" font-size="15" font-weight="bold" fill="#263c24">SIMULATED CAPTURE · No employee desktop was recorded</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function screenshotHistory(e){let captures=periodCaptures(e.id),s=employeeSession(e.id);return `<div class="card"><div class="card-head wrap"><div><h2>Screenshot history</h2><small>${periodTitle()} · ${captures.length} retained captures</small></div><button class="btn" onclick="captureSettingsDialog()">Screenshot settings</button></div><div class="explain"><b>${state.capturePolicy.enabled?'Scheduled every '+captureIntervalLabel():'Capture is paused'}</b><p>${s&&state.capturePolicy.enabled?'Next sample is due '+stamp(s.lastCaptureAt+state.capturePolicy.intervalMinutes*60000)+'.':'A clocked-in session and enabled policy are required for new captures.'} These images are illustrative examples, not actual employee desktop screenshots.</p></div><div class="screenshot-grid">${captures.map(c=>`<button class="capture-card" onclick="openCapture('${c.id}')"><div class="capture-image"><img src="${sampleCaptureImage(c)}" alt="Illustrative desktop capture for ${esc(project(c.project)?.name)}"><span>SAMPLE</span></div><div class="capture-caption"><div class="flex between"><b>${new Date(c.at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</b>${pill(c.activity==='idle'?'Idle':c.activity==='working'?'Working':'Unknown',c.activity==='idle'?'amber':'green')}</div><p>${esc(project(c.project)?.name||'Project unavailable')}</p><small>${stamp(c.at)} · ${esc(employeeById(c.employeeId)?.name)}</small></div></button>`).join('')||'<div class="empty">No screenshots in this period. Select another day or use Generate sample capture during a simulated clock session.</div>'}</div></div>`}
function openCapture(id){let c=state.captures.find(c=>c.id===id);if(!c)return;let e=employeeById(c.employeeId),s=state.sessions.find(s=>s.id===c.sessionId);modal('Screenshot review',`<div class="flex between wrap" style="margin-bottom:15px"><div><b>${esc(e?.name)}</b><p>${esc(project(c.project)?.name)} · ${stamp(c.at)}</p></div>${pill('Simulated capture','amber')}</div><img src="${sampleCaptureImage(c)}" alt="Illustrative employee desktop capture" style="display:block;width:100%;border:1px solid var(--line);border-radius:10px"><div class="info-grid" style="margin-top:18px"><div><small>ACTIVITY AT CAPTURE</small><p>${esc(c.activity)}</p></div><div><small>CAPTURE INTERVAL</small><p>${c.intervalMinutes} minutes</p></div><div><small>SESSION START</small><p>${s?stamp(s.start):'Unavailable'}</p></div></div><p class="metric-note">Stored with the employee, project, timestamp and work-session reference. Production images would be captured by the employee desktop app and retrieved from private storage.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="downloadSampleCapture('${id}')">Download sample image</button></div>`)}
function downloadSampleCapture(id){let c=state.captures.find(c=>c.id===id);if(c)download(new Blob([decodeURIComponent(sampleCaptureImage(c).split(',').slice(1).join(','))],{type:'image/svg+xml'}),'Team3-SIMULATED-capture-'+localDate(c.at)+'-'+id.slice(0,8)+'.svg')}
function createSampleCapture(e,s){let now=Date.now();state.captures.push({id:uid(),employeeId:e.id,sessionId:s.id,project:s.project,at:now,activity:activityAt(s),intervalMinutes:state.capturePolicy.intervalMinutes,source:'sample'});s.lastCaptureAt=now}
function generateSampleCapture(id){let e=employeeById(id),s=employeeSession(id);if(!e?.active||!s||!state.capturePolicy.enabled)return toast('An active employee, open session and enabled policy are required.');createSampleCapture(e,s);save();employeeTab='screenshots';render();toast('Illustrative screenshot saved to the employee’s history.')}
// ponytail: demo-only scheduling while the page is open; a desktop agent owns production capture.
function runSampleCaptureSchedule(){let changed=false;if(!state.capturePolicy?.enabled)return;for(const s of state.sessions.filter(s=>s.end===null)){let e=employeeById(s.employeeId);if(e?.active&&Date.now()-s.lastCaptureAt>=state.capturePolicy.intervalMinutes*60000){createSampleCapture(e,s);changed=true}}if(changed){save();if(page==='employee'&&employeeTab==='screenshots'&&!document.getElementById('modal').open)render()}}
function exportEmployeeReport(id){let[a,b]=periodBounds(),members=state.employees.filter(e=>(!id||e.id===id));csv('Team3-employee-work-'+(workPeriod==='day'?workDate:workMonth)+'.csv',[['Period','Employee ID','Employee','Team','Days worked','Clocked hours','Working hours','Idle hours','Unknown hours','Live status','Projects worked'],...members.map(e=>{let m=activityMetrics(e.id,a,b);return [periodTitle(),e.code,e.name,e.team,m.days,m.total.toFixed(2),m.working.toFixed(2),m.idle.toFixed(2),m.unknown.toFixed(2),employeeLive(e),[...new Set(m.sessions.map(s=>project(s.project)?.name||s.project))].join('; ')]})])}
initializeWorkforce();
setInterval(runSampleCaptureSchedule,15000);
render();
</script></body></html>
