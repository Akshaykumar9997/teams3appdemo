const ICONS={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',projects:'M3 6h7l2 3h9v11H3z M3 6V4h8l2 2h6v3',documents:'M6 3h8l4 4v14H6z M14 3v5h4 M9 12h6 M9 16h6',chat:'M21 11a8 8 0 0 1-8 8H6l-4 3 1-7a8 8 0 1 1 18-4 M7 10h10 M7 14h6',approval:'M9 12l2 2 5-5 M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z',attendance:'M12 8v5l3 2 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',reports:'M4 20V10h4v10 M10 20V4h4v16 M16 20v-7h4v7',mobile:'M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2 M10 18h4',guide:'M4 3h6l2 2 2-2h6v17h-6l-2 2-2-2H4z M12 5v17',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M15 15l6 6',arrow:'M4 12h16 M14 6l6 6-6 6',plus:'M12 5v14 M5 12h14',check:'M5 12l4 4L19 6',close:'M6 6l12 12 M18 6L6 18',building:'M4 21V6l8-3 8 3v15 M2 21h20 M8 8v2 M16 8v2 M8 13v2 M16 13v2 M10 21v-4h4v4',upload:'M12 16V3 M7 8l5-5 5 5 M4 15v6h16v-6',bell:'M5 17h14l-2-4V9a5 5 0 0 0-10 0v4z M10 21h4',back:'M20 12H4 M10 6l-6 6 6 6'};
const icon=k=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[k]||ICONS.projects}"/></svg>`;

const uid=()=>crypto.randomUUID();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=d=>new Date(d).getFullYear()+'-'+String(new Date(d).getMonth()+1).padStart(2,'0')+'-'+String(new Date(d).getDate()).padStart(2,'0');
const today=()=>localDate(Date.now());
const relativeDate=n=>{let d=new Date();d.setDate(d.getDate()+n);return localDate(d)};
const dateLabel=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'Not set';
const stamp=t=>new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function seed(){const names=['Sharma Residence','Mehta Office','Iyer Residence','Verma Café','Nair Villa','Kapoor Apartment'];const stages=[2,1,3,5,7,4];let s={projects:[],docs:[],messages:[],sessions:[],next:48};names.forEach((name,i)=>{let id='p'+i,stage=stages[i],p={id,no:`T3-${new Date().getFullYear()}-${String(42+i).padStart(4,'0')}`,name,client:['Amit Sharma','Rohan Mehta','Lakshmi Iyer','Neha Verma','Vikram Nair','Anita Kapoor'][i],brief:['Warm contemporary interiors for a 3-bedroom home. Preserve the existing kitchen plumbing.','A flexible 28-seat workspace with two meeting rooms.','Renovation with a new kitchen opening; structural clearance required.','A welcoming café with 32 seats and an earthy material palette.','A complete villa interior with custom joinery.','A compact city apartment with concealed storage.'][i],stage,route:i===4?'client':'owner',priority:i===2?'High':'Normal',due:relativeDate([-1,3,-3,1,8,2][i]),records:[],history:[],hold:'',package:null};for(let j=0;j<=stage;j++){if(j===5&&p.route==='client')continue;p.records.push({stage:j,entered:Date.now()-(10-j)*86400000,completed:j<stage?Date.now()-(9-j)*86400000:null,owner:j>0&&j<5?PEOPLE[j-1]:j===6?p.client:'Owner',due:relativeDate(j-stage+[-1,3,-3,1,8,2][i])});p.history.push({at:Date.now()-(10-j)*86400000,actor:j?PEOPLE[Math.min(j-1,3)]:'Owner',title:j?`${STAGES[j===6&&p.route==='client'?4:j-1]} → ${STAGES[j]}`:'Client brief captured',note:j?'Deliverable and responsibility recorded.':p.brief})}s.projects.push(p);for(let t=0;t<Math.min(stage,4);t++){let d={id:uid(),project:id,team:TEAMS[t],code:p.no+'-'+CODES[t]+'-001',name:['Initial space plan','Furniture & floor layout','Structural review','Interior visual concept'][t],version:1,by:PEOPLE[t],at:Date.now()-(6-t)*86400000,source:'sample',original:'Sample design brief.txt'};s.docs.push(d);if(t===1&&i===0)s.docs.push({...d,id:uid(),version:2,at:d.at+3600000})}if(stage>=5){p.package=s.docs.filter(d=>d.project===id).at(-1)?.id;if(stage===7)p.history.push({at:Date.now()-86400000,actor:'Owner · client decision recorded',title:'Client approved → Execution',note:'Sample client sign-off recorded against the submitted version.'})}s.messages.push({id:uid(),project:id,by:PEOPLE[Math.min(stage-1,3)],at:Date.now()-3600000,text:i===2?'The existing beam measurements are needed before I can complete the review. Please confirm the site survey.':'Latest design files are in the project library. Please use the current version for the next stage.'},{id:uid(),project:id,by:'Owner',at:Date.now()-1800000,text:i===2?'I will coordinate the site measurement. Please record this dependency against the stage.':'Thanks. Keep the handoff notes and deadline updated here.'});if(i===2)p.hold='Waiting for existing beam measurements from the site survey.'});let morning=new Date();morning.setHours(9,0,0,0);PEOPLE.forEach((name,i)=>{s.sessions.push({id:uid(),employee:name,project:'p'+i,start:morning.getTime()-86400000,end:morning.getTime()-86400000+(7+i*.25)*3600000});if(i<3)s.sessions.push({id:uid(),employee:name,project:'p'+i,start:Date.now()-(2+i*.4)*3600000,end:null})});
const archived={id:'archive1',no:`T3-${new Date().getFullYear()-1}-0018`,name:'Nair Villa · Phase 1',client:'Vikram Nair',brief:'Completed living room and dining interior. Retained for future renovation reference.',stage:8,route:'owner',priority:'Normal',due:`${new Date().getFullYear()-1}-11-20`,hold:'',records:[],history:[],package:null};
const oldTime=new Date(`${new Date().getFullYear()-1}-11-20T15:30:00`).getTime();
for(let stage=0;stage<8;stage++)archived.records.push({stage,entered:oldTime-(9-stage)*86400000,completed:oldTime-(8-stage)*86400000,owner:stage>0&&stage<5?PEOPLE[stage-1]:'Owner',due:archived.due});
archived.history.push({at:oldTime,actor:'Owner',title:'Project completed and retained',note:'Client handover completed. Final documents remain searchable under the original project number.'});
s.projects.push(archived);s.docs.push({id:'archive-doc',project:archived.id,team:'Visualizer',code:archived.no+'-VIS-001',name:'Final interior handover',version:1,by:'Meena J.',at:oldTime,source:'sample',original:'Archived illustrative handover.txt'});
return s}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch{state=seed()}
let page='dashboard',selected='p0',detailTab='overview',projectView='list',docQuery='',docProject='',docTeam='',chatProject='p0',mobileTab='chat',mobileChannel=false,attendanceDate=today(),toastTimer;
const project=id=>state.projects.find(p=>p.id===id);
const stageOwner=p=>p.stage>0&&p.stage<5?(employeeById(p.assignees?.[TEAMS[p.stage-1]])?.active?employeeById(p.assignees[TEAMS[p.stage-1]]).name:'Unassigned'):p.stage===6?p.client:'Owner';
const overdue=p=>p.stage<8&&p.due<today();
const lateDays=p=>Math.max(0,Math.round((new Date(today()+'T12:00:00')-new Date(p.due+'T12:00:00'))/86400000));
const currentDoc=d=>!state.docs.some(x=>x.project===d.project&&x.code===d.code&&x.version>d.version);
const latestDocs=id=>state.docs.filter(d=>d.project===id&&currentDoc(d));
const history=(p,title,note,actor='Owner')=>p.history.push({at:Date.now(),actor,title,note});
const pill=(s,c='')=>`<span class="pill ${c}">${esc(s)}</span>`;
function status(p){return p.hold?pill('Blocked','red'):p.stage===8?pill('Completed','green'):p.stage===5||p.stage===6?pill('Awaiting review','amber'):overdue(p)?pill('Overdue','red'):pill(p.stage===7?'On site':'In progress','green')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('Browser storage is full or unavailable. Keep this tab open; changes are not saved.');return false}}
function toast(text){let t=document.getElementById('toast');t.className='toast';t.textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='';t.textContent=''},4200)}
function go(p){page=p;render();window.scrollTo(0,0)}
function openProject(id,tab='overview'){selected=id;detailTab=tab;page='detail';render();window.scrollTo(0,0)}
function title(eyebrow,heading,subtitle,actions=''){return `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${heading}</h1><p>${subtitle}</p></div><div class="flex">${actions}</div></div>`}
function render(){const nav=[['dashboard','Overview'],['projects','Projects'],['repository','Project Repository'],['documents','Document library'],['chat','Project chat'],['approval','Approvals'],['employees','Employee Management'],['reports','Reports']];document.getElementById('app').innerHTML=`<aside class="rail"><div class="brand"><div class="brand-mark">t3</div><div><b>TEAM3</b><small>ASSOCIATES</small></div></div><div class="rail-label">STUDIO WORKSPACE</div><nav class="nav" aria-label="Main navigation">${nav.map(([k,v])=>`<button class="${page===k||(page==='detail'&&k==='projects')||(page==='employee'&&k==='employees')||(page==='repositoryDetail'&&k==='repository')?'active':''}" onclick="go('${k}')">${icon(k)}${v}${k==='approval'?`<span class="count">${state.projects.filter(p=>p.stage===5).length}</span>`:''}</button>`).join('')}</nav><div class="rail-bottom"><div class="rail-label">EXPLORE THE DEMO</div><nav class="nav"><button class="${page==='mobile'?'active':''}" onclick="go('mobile')">${icon('mobile')}Mobile companion</button><button class="${page==='guide'?'active':''}" onclick="go('guide')">${icon('guide')}Solution walkthrough</button></nav><div class="rail-note"><b>A connected studio.</b>One project. Every team.<br>Nothing lost between handoffs.</div></div></aside><main class="main"><header class="top"><form class="global-search" onsubmit="event.preventDefault();searchAll(this.q.value)">${icon('search')}<input aria-label="Search all projects and documents" name="q" placeholder="Search a project, client or document…" type="search"></form><div class="flex"><span class="pill demo-tag">INTERACTIVE DEMO</span><button class="btn sm" onclick="go('mobile')">${icon('mobile')}Mobile</button><div class="flex owner"><div class="avatar">OW</div><div class="identity"><b>Studio owner</b><br><small>Admin workspace</small></div></div></div></header><section class="content">${screen()}<div class="footer-note"><span>TEAM3 ASSOCIATES · Demonstration workspace · Sample projects</span><span>Saved on this browser only <button class="text-link" onclick="resetDialog()">Reset demo</button> · <button class="text-link" onclick="go('guide')">How it works</button></span></div></section></main>`;updateClocks()}
function screen(){return ({dashboard,projects,repository,repositoryDetail,employees:employeeManagement,employee:employeeProfile,documents,chat:chatPage,approval:approvals,attendance,reports,mobile,guide,detail:projectDetail}[page]||dashboard)()}
function stat(label,value,note,i){return `<div class="card stat"><div class="flex between"><span class="muted">${label}</span><span class="icon-box">${icon(i)}</span></div><div class="number">${value}</div><small>${note}</small></div>`}
function projectRows(arr){return arr.map(p=>`<tr><td><div class="flex"><span class="project-icon">${icon('building')}</span><div><button class="text-link" onclick="openProject('${p.id}')">${esc(p.name)}</button><div class="sub">${p.no}</div></div></div></td><td><b>${STAGES[p.stage]}</b><div class="sub">${esc(stageOwner(p))}</div></td><td><span class="${overdue(p)?'text-red':''}">${dateLabel(p.due)}</span><div class="sub">${overdue(p)?lateDays(p)+' days overdue':'Stage deadline'}</div></td><td>${status(p)}</td><td><button class="btn sm" aria-label="Open ${esc(p.name)}" onclick="openProject('${p.id}')">${icon('arrow')}</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No matching projects.</td></tr>'}
function projectTable(arr){return `<div class="table-scroll"><table><thead><tr><th>Project / client</th><th>Currently with</th><th>Due date</th><th>Status</th><th></th></tr></thead><tbody>${projectRows(arr)}</tbody></table></div>`}
function dashboard(){let active=state.projects.filter(p=>p.stage<8),pending=state.projects.filter(p=>p.stage===5),late=active.filter(overdue),working=state.sessions.filter(s=>s.end===null);return title('YOUR STUDIO, AT A GLANCE','Good morning, Team3.','A clear view of your projects, people and next decisions.',`<button class="btn" onclick="go('guide')">${icon('guide')}Walkthrough</button><button class="btn primary" onclick="newProject()">${icon('plus')}New project</button>`)+`<div class="stats">${stat('Active projects',active.length,'Across the design-to-delivery journey','projects')}${stat('Awaiting your approval',pending.length,'Review the exact submitted version','approval')}${stat('Overdue stages',late.length,'Deadlines that need your attention','attendance')}${stat('Clocked in',working.length,'of '+state.employees.filter(e=>e.active).length+' team members','dashboard')}</div><div class="columns"><div class="card"><div class="card-head"><div><h2>Project pulse</h2><small>Every project has a visible next owner.</small></div><button class="text-link" onclick="go('projects')">View all projects ↗</button></div><div class="flow-strip">${TEAMS.map((t,i)=>`<div class="flow-block ${i===2?'focus':''}"><span>${String(i+1).padStart(2,'0')} / ${t}</span><b>${state.projects.filter(p=>p.stage===i+1).length}</b></div>`).join('')}</div>${projectTable(active.slice(0,5))}</div><div class="card attention"><div class="card-head"><h2>Needs attention</h2>${pill(late.length+pending.length,'amber')}</div><div class="attention-list">${[...pending,...late].slice(0,3).map(p=>`<div class="attention-item">${pill(p.stage===5?'Approval requested':p.hold?'Dependency flagged':lateDays(p)+' days overdue',p.stage===5?'amber':'red')}<h3 style="margin-top:10px">${esc(p.name)}</h3><p>${p.stage===5?'Final visual concept is ready for your review.':esc(p.hold||`${stageOwner(p)} · ${STAGES[p.stage]} stage`)}</p><button class="btn sm" onclick="${p.stage===5?"go('approval')":`openProject('${p.id}')`}">${p.stage===5?'Review submission':'View stage'} ${icon('arrow')}</button></div>`).join('')||'<p class="muted">All caught up.</p>'}</div><div class="explain" style="margin-top:15px"><b>Accountability with context.</b><p>See the responsible person, deadline and recorded blocker before following up.</p></div></div></div><div class="spacer"></div><div class="card-head"><h2>Across the studio</h2><span class="muted">Four teams. One connected workflow.</span></div><div class="team-grid">${TEAMS.map((t,i)=>{let ps=state.projects.filter(p=>p.stage===i+1);return `<div class="team-tile"><div class="flex"><div class="avatar">${esc((teamEmployee(t)?.name||'—').slice(0,2).toUpperCase())}</div><div><b>${t}</b><br><small>${esc(teamEmployee(t)?.name||'No active employee')}</small></div></div><div class="progress"><span style="width:${Math.min(ps.length/3*100,100)}%"></span></div><div class="flex between"><small>${ps.length} active stage${ps.length!==1?'s':''}</small><small class="${ps.some(overdue)?'text-red':''}">${ps.filter(overdue).length} overdue</small></div></div>`}).join('')}</div>`}
function projects(){return title('PROJECT CONTROL','From first sketch to site.','Track ownership, deadlines and every handoff in one place.',`<div class="toggle"><button class="${projectView==='list'?'active':''}" onclick="projectView='list';render()">List</button><button class="${projectView==='board'?'active':''}" onclick="projectView='board';render()">By team</button></div><button class="btn primary" onclick="newProject()">${icon('plus')}New project</button>`)+(projectView==='list'?`<div class="card"><div class="filters"><input type="search" aria-label="Filter projects" placeholder="Search project name, ID or client" oninput="filterProjects(this.value)"><span class="muted">${state.projects.length} projects</span></div><div id="projectResults">${projectTable(state.projects)}</div></div>`:`<div class="board">${TEAMS.map((t,i)=>`<div class="board-col"><div class="flex between"><h3>${t}</h3>${pill(state.projects.filter(p=>p.stage===i+1).length)}</div>${state.projects.filter(p=>p.stage===i+1).map(p=>`<button class="board-card" onclick="openProject('${p.id}')"><small>${p.no}</small><b>${esc(p.name)}</b>${status(p)}<div class="flex between" style="margin-top:16px"><small>${esc(stageOwner(p))}</small><small>${dateLabel(p.due)}</small></div></button>`).join('')||'<p class="muted">No active stages</p>'}</div>`).join('')}</div><div class="spacer"></div><div class="card"><h2>Brief, review & execution</h2>${projectTable(state.projects.filter(p=>p.stage===0||p.stage>4))}</div>`)+`<div class="spacer"></div><div class="explain"><b>A structured route, with room for revisions.</b><p>Owner brief → Architect → Drafting → Structural → Visualizer → approvals → execution. Send work back with a reason; the history keeps the original handoff and deadline.</p></div>`}
function filterProjects(q){q=q.toLowerCase().trim();document.getElementById('projectResults').innerHTML=projectTable(state.projects.filter(p=>(p.name+' '+p.no+' '+p.client+' '+stageOwner(p)).toLowerCase().includes(q)))}
function projectDetail(){let p=project(selected);if(!p)return projects();return title(p.no,esc(p.name),esc(p.client)+' · '+(p.route==='owner'?'Owner review, then client approval':'Direct client review'),`<button class="btn" onclick="go('projects')">${icon('back')}Projects</button>${status(p)}`)+`<div class="card"><div class="info-grid"><div><small>CURRENT RESPONSIBILITY</small><p>${STAGES[p.stage]} · ${esc(stageOwner(p))}</p></div><div><small>STAGE DEADLINE</small><p class="${overdue(p)?'text-red':''}">${dateLabel(p.due)} ${overdue(p)?'· '+lateDays(p)+' days overdue':''}</p></div><div><small>NEXT MILESTONE</small><p>${p.stage===4?(p.route==='owner'?'Owner review':'Client review'):STAGES[Math.min(p.stage+1,8)]}</p></div></div><div class="journey">${STAGES.slice(0,8).map((t,i)=>{let record=p.records.filter(r=>r.stage===i).at(-1),done=!!record?.completed,skip=i===5&&p.route==='client';return `<div class="journey-step ${done?'done':''} ${p.stage===i?'current':''}"><span class="circle">${done?'✓':skip?'–':i+1}</span><b>${t}</b><small>${skip?'Not required':done?'Completed':p.stage===i?'Current stage':'Upcoming'}</small></div>`}).join('')}</div><div class="explain"><b>Client brief</b><p>${esc(p.brief)}</p></div>${p.hold?`<div class="explain" style="margin-top:12px;border-color:#eccfc3;background:#fff4ed"><b>Blocker recorded</b><p>${esc(p.hold)}</p></div>`:''}<div class="detail-actions">${p.stage<5?`<button class="btn primary" onclick="handoffDialog('${p.id}')">${p.stage===4?'Submit for review':'Complete & hand off'} ${icon('arrow')}</button>`:p.stage===5?`<button class="btn primary" onclick="go('approval')">Review submission</button>`:p.stage===6?`<button class="btn primary" onclick="clientDecision('${p.id}')">Record client decision</button>`:p.stage===7?`<button class="btn primary" onclick="completeDialog('${p.id}')">Mark project completed</button>`:''}${p.stage<8?`${p.stage>0&&p.stage<5?`<button class="btn" onclick="assignEmployeeDialog('${p.id}')">Assign employee</button>`:''}<button class="btn" onclick="deadlineDialog('${p.id}')">Deadline & blocker</button>`:''}${p.stage>1&&p.stage<8?`<button class="btn" onclick="revisionDialog('${p.id}')">Request revision</button>`:''}<button class="btn" onclick="uploadDialog('${p.id}')">${icon('upload')}Add document</button></div></div><div class="tabs" role="tablist">${[['overview','Stage history'],['documents','Documents'],['chat','Project chat']].map(([k,v])=>`<button role="tab" aria-selected="${detailTab===k}" class="${detailTab===k?'active':''}" onclick="detailTab='${k}';render()">${v}${k==='documents'?' · '+latestDocs(p.id).length:''}</button>`).join('')}</div>${detailTab==='overview'?`<div class="card"><div class="card-head"><h2>Every decision leaves a trail</h2><button class="btn sm" onclick="exportHistory('${p.id}')">Export history</button></div>${stageRegister(p)}${p.history.slice().reverse().map(h=>`<div class="history-item"><span class="history-dot">${icon('check')}</span><div class="grow"><div class="flex between wrap"><b>${esc(h.title)}</b><small>${stamp(h.at)}</small></div><p>${esc(h.note)}</p><small>${esc(h.actor)}</small></div></div>`).join('')}</div>`:detailTab==='documents'?`<div class="card">${docTable(state.docs.filter(d=>d.project===p.id))}</div>`:chatSurface(p.id)}`}
function stageRegister(p){return `<details style="margin-bottom:18px"><summary style="cursor:pointer;color:var(--green);font-weight:600;padding:10px 0">Stage timings & responsibility</summary><p class="muted" style="margin:8px 0">Elapsed time measures the stage's calendar duration, including nights and dependencies. Employee working hours are recorded separately in Employee Management.</p><div class="table-scroll"><table><thead><tr><th>Stage visit</th><th>Responsible</th><th>Received</th><th>Completed</th><th>Stage deadline</th><th>Elapsed</th></tr></thead><tbody>${p.records.filter(r=>r.entered).map(r=>`<tr><td>${STAGES[r.stage]}</td><td>${esc(r.owner)}</td><td>${stamp(r.entered)}</td><td>${r.completed?stamp(r.completed):r.stage===p.stage?'Current visit':'Reopened'}</td><td>${dateLabel(r.due)}</td><td>${Math.max(0,((r.completed||Date.now())-r.entered)/3600000).toFixed(1)} h</td></tr>`).join('')}</tbody></table></div></details>`}
function documentMatches(d,q){let p=project(d.project);return [d.code,d.name,d.team,d.by,p?.no,p?.name,p?.client].join(' ').toLowerCase().includes(q.toLowerCase().trim())}
function filteredDocs(){return state.docs.filter(d=>(!docProject||d.project===docProject)&&(!docTeam||d.team===docTeam)&&documentMatches(d,docQuery)).sort((a,b)=>b.at-a.at)}
function documents(){return title('YOUR STUDIO LIBRARY','Find the file. Keep the context.','Search by project number, client, document name or team.',`<button class="btn primary" onclick="uploadDialog()">${icon('upload')}Add document</button>`)+`<div class="card"><div class="filters"><input type="search" id="docSearch" aria-label="Search documents" placeholder="Try Sharma, floor layout or T3-…" value="${esc(docQuery)}" oninput="docQuery=this.value;refreshDocs()"><select aria-label="Filter by project" onchange="docProject=this.value;refreshDocs()"><option value="">All projects</option>${state.projects.map(p=>`<option value="${p.id}" ${docProject===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select aria-label="Filter by team" onchange="docTeam=this.value;refreshDocs()"><option value="">All teams</option>${TEAMS.map(t=>`<option ${docTeam===t?'selected':''}>${t}</option>`).join('')}</select></div><div id="docResults">${docTable(filteredDocs())}</div></div><div class="spacer"></div><div class="explain"><b>One project number connects everything.</b><p>For example, ${state.projects[0].no}-DRF-001 · V2 identifies a drafting document and its revision. Uploading V3 preserves V1 and V2. Project search includes every version, even after the project is completed.</p></div>`}
function refreshDocs(){document.getElementById('docResults').innerHTML=docTable(filteredDocs())}
function docTable(arr){return `<div class="table-scroll"><table><thead><tr><th>Document</th><th>Project</th><th>Team / author</th><th>Version</th><th>Updated</th><th></th></tr></thead><tbody>${arr.map(d=>`<tr><td><div class="flex"><div class="file-icon">${d.source==='sample'?'DEMO':esc((d.original||'FILE').split('.').pop().slice(0,5).toUpperCase())}</div><div><button class="text-link" onclick="previewDoc('${d.id}')">${esc(d.name)}</button><div class="sub">${d.code}</div></div></div></td><td>${esc(project(d.project)?.name)}<div class="sub">${project(d.project)?.no}</div></td><td>${d.team}<div class="sub">${d.by}</div></td><td>${pill('V'+d.version,currentDoc(d)?'green':'')}<div class="sub">${currentDoc(d)?'Current':'Superseded'}</div></td><td>${stamp(d.at)}</td><td><button class="btn sm" onclick="previewDoc('${d.id}')">Open</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No files found. Try a project name or clear the filters.</td></tr>'}</tbody></table></div>`}
function chatPage(){return title('PROJECT CONVERSATIONS','The conversation stays with the project.','A shared room for the owner and all four teams.')+`<div class="chat-layout"><div class="chat-list"><small>PROJECT ROOMS · ${state.projects.length}</small>${state.projects.map(p=>`<button class="chat-channel ${chatProject===p.id?'active':''}" onclick="chatProject='${p.id}';render()"><b># ${esc(p.name)}</b><small>${p.no}</small></button>`).join('')}</div>${chatSurface(chatProject)}</div><div class="spacer"></div><div class="explain"><b>Files shared here are searchable in the library.</b><p>Attach a file to this project room. It receives a project-linked document code and a permanent place in the project record, instead of disappearing into a chat stream.</p></div>`}
function chatSurface(id,phone=false){let p=project(id);return `<div class="chat-main">${!phone?`<div class="chat-head flex between"><div><h3># ${esc(p.name)}</h3><small>${p.no} · Owner + ${state.employees.filter(e=>e.active).length} team members</small></div><button class="btn sm" onclick="openProject('${id}')">Project</button></div>`:''}<div class="messages" id="messages">${state.messages.filter(m=>m.project===id).map(m=>`<div class="message ${m.by==='Owner'?'mine':''}"><span class="avatar">${esc(m.by.slice(0,2).toUpperCase())}</span><div class="bubble"><small><b>${esc(m.by)}</b> · ${new Date(m.at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</small>${m.text?`<p>${esc(m.text)}</p>`:''}${m.doc?`<button class="text-link" onclick="previewDoc('${m.doc}')">${icon('documents')} ${esc(state.docs.find(d=>d.id===m.doc)?.name||'Document')} ↗</button>`:''}</div></div>`).join('')||'<div class="empty">This project room is ready. Start the conversation.</div>'}</div><form class="composer" onsubmit="sendMessage(event,'${id}')"><button type="button" class="btn" title="Attach a project file" aria-label="Attach a project file" onclick="uploadDialog('${id}',true)">${icon('plus')}</button><input name="message" maxlength="2000" required aria-label="Message" placeholder="Message the project team…"><button class="btn primary" type="submit">Send</button></form></div>`}
function sendMessage(e,id){e.preventDefault();let text=e.target.message.value.trim();if(!text)return;state.messages.push({id:uid(),project:id,by:'Owner',at:Date.now(),text});save();render();document.getElementById('messages')?.scrollTo(0,999999)}
function approvalCard(p,phone=false){let d=state.docs.find(x=>x.id===p.package);return `<div class="approval"><div class="flex between">${pill(p.stage===5?'OWNER REVIEW':'CLIENT REVIEW','amber')}<small>${dateLabel(p.due)}</small></div><h3>${esc(p.name)}</h3><small>${p.no}</small><p>${d?esc(d.name)+' · V'+d.version:'No submission attached'}<br><small>Submitted by Meena J. · Visualizer</small></p><div class="flex wrap"><button class="btn sm" onclick="previewDoc('${d?.id}')">View document</button>${p.stage===5?`<button class="btn primary sm" onclick="approveDialog('${p.id}')">Approve</button><button class="btn sm" onclick="revisionDialog('${p.id}')">Changes</button>`:!phone?`<button class="btn primary sm" onclick="clientDecision('${p.id}')">Record decision</button>`:pill('Awaiting client')}</div></div>`}
function approvals(){let owner=state.projects.filter(p=>p.stage===5),client=state.projects.filter(p=>p.stage===6);return title('REVIEW & RELEASE','Good work deserves a clear sign-off.','Approvals are attached to a specific document version.')+`<div class="card-head"><h2>Your review queue</h2>${pill(owner.length+' pending','amber')}</div><div class="approval-grid">${owner.map(p=>approvalCard(p)).join('')||'<div class="card empty">No owner approvals pending. Submit a Visualizer stage to add one.</div>'}</div><div class="spacer"></div><div class="card-head"><h2>With the client</h2>${pill(client.length+' pending')}</div><div class="approval-grid">${client.map(p=>approvalCard(p)).join('')||'<div class="card empty">Client submissions appear here after owner approval, or directly when that route is selected.</div>'}</div><div class="spacer"></div><div class="explain"><b>Approval is a gate, not just a label.</b><p>Work moves into execution only after client sign-off. A change request reopens the selected team stage with a reason. Revised documents require a fresh submission and approval.</p></div>`}
function sessionHours(s,start=-Infinity,end=Infinity){return Math.max(0,Math.min(s.end??Date.now(),end)-Math.max(s.start,start))/3600000}
function dayBounds(date){let a=new Date(date+'T00:00:00'),b=new Date(a);b.setDate(b.getDate()+1);return [a.getTime(),b.getTime()]}
function hoursFor(name,date){let [a,b]=dayBounds(date);return state.sessions.filter(s=>s.employee===name).reduce((v,s)=>v+sessionHours(s,a,b),0)}
function attendance(){return employeeManagement()}
function updateClocks(){document.querySelectorAll('[data-clock]').forEach(el=>{let sec=Math.max(0,Math.floor((Date.now()-Number(el.dataset.clock))/1000));el.textContent=String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor(sec/60)%60).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')})}
setInterval(updateClocks,1000);
function reports(){return title('OPERATIONS REPORT','Less chasing. More clarity.','Metrics are calculated from the same project and attendance records.',`<button class="btn" onclick="exportProjects()">Export project report</button>`)+`<div class="columns"><div class="card"><div class="card-head"><h2>Where work is waiting</h2><small>Current stage counts</small></div><div class="report-bars">${STAGES.map((t,i)=>{let n=state.projects.filter(p=>p.stage===i).length;return `<div><div class="flex between"><span>${t}</span><b>${n}</b></div><div class="progress"><span style="width:${n/Math.max(1,state.projects.length)*100}%"></span></div></div>`}).join('')}</div></div><div class="card"><h2>Delivery health</h2><div class="attention-item"><small>PROJECTS COMPLETED</small><h1>${state.projects.filter(p=>p.stage===8).length}</h1></div><div class="attention-item"><small>OVERDUE ACTIVE STAGES</small><h1 class="text-red">${state.projects.filter(overdue).length}</h1></div><div class="attention-item"><small>RECORDED BLOCKERS</small><h1>${state.projects.filter(p=>p.hold&&p.stage<8).length}</h1></div><div class="explain">A delay signals a follow-up. Review blockers and history before attributing responsibility.</div></div></div><div class="spacer"></div><div class="card"><h2>Team responsibility & recorded time</h2><div class="table-scroll"><table><thead><tr><th>Member</th><th>Current stages</th><th>Overdue stages</th><th>Completed stage visits</th><th>Hours today</th><th>All recorded hours</th></tr></thead><tbody>${state.employees.map(employee=>{let name=employee.name;return `<tr><td><b>${esc(name)}</b>${!employee.active?'<div class="sub">Removed · history retained</div>':''}</td><td>${state.projects.filter(p=>stageOwner(p)===name&&p.stage<8).length}</td><td>${state.projects.filter(p=>stageOwner(p)===name&&overdue(p)).length}</td><td>${state.projects.reduce((n,p)=>n+p.records.filter(r=>r.owner===name&&r.completed).length,0)}</td><td>${hoursFor(name,today()).toFixed(2)}</td><td>${state.sessions.filter(s=>s.employee===name).reduce((n,s)=>n+sessionHours(s),0).toFixed(2)}</td></tr>`}).join('')}</tbody></table></div><p class="metric-note">Completed stage visits include earlier review cycles. Attendance hours and project delivery are separate measures.</p></div>`}
function mobile(){return title('THE MOBILE COMPANION','Your studio, within reach.','A focused mobile experience for communication, files and owner decisions.',`<div class="pill green">Shared demo data</div>`)+`<div class="phone-layout"><div class="phone-copy"><div class="eyebrow text-green">DESKTOP DEPTH. MOBILE FOCUS.</div><h2>Keep decisions moving.<br>Wherever the day takes you.</h2><p>Try the interactive phone preview. Messages, documents and approval decisions update the same demo records used by the desktop workspace.</p>${[['chat','Project conversations','Read updates, send a message and attach a file to the right project.'],['documents','Your files, on demand','Search the project number, client name or document title. Open a specific revision.'],['approval','Owner approvals','Review the submitted version, approve it, or send it back with a clear reason.']].map(([i,t,p])=>`<div class="feature-row">${icon(i)}<div><h3>${t}</h3><p>${p}</p></div></div>`).join('')}<div class="explain" style="margin-top:24px"><b>Desktop owns the full workflow.</b><p>Project setup, assignment, deadlines, attendance and reports stay on desktop. The phone demonstrates only the three requested features.</p></div></div><div class="phone"><div class="phone-status"><span>9:41</span><span>●●● &nbsp; ▰</span></div><div class="phone-header"><div class="flex between"><b>TEAM3 <small> / STUDIO</small></b><div class="avatar">OW</div></div><h2>${mobileTab==='chat'?(mobileChannel?'Project room':'Conversations'):mobileTab==='documents'?'Document library':'Your approvals'}</h2></div><div class="phone-content">${mobileBody()}</div><nav class="phone-nav" aria-label="Mobile navigation">${[['chat','Chat'],['documents','Documents'],['approval','Approvals']].map(([k,v])=>`<button class="${mobileTab===k?'active':''}" onclick="mobileTab='${k}';mobileChannel=false;render()">${icon(k)}${v}</button>`).join('')}</nav></div></div>`}
function mobileBody(){if(mobileTab==='chat')return mobileChannel?`<button class="text-link" onclick="mobileChannel=false;render()">← All conversations</button><h3 style="margin:16px 0">${esc(project(chatProject).name)}</h3>${chatSurface(chatProject,true)}`:state.projects.map(p=>`<button class="phone-doc" onclick="chatProject='${p.id}';mobileChannel=true;render()"><span class="avatar">${esc(p.name.slice(0,2).toUpperCase())}</span><span class="grow"><b>${esc(p.name)}</b><small>${p.no}</small><p style="font-size:12px;color:var(--muted);margin-top:5px">${esc((state.messages.filter(m=>m.project===p.id).at(-1)?.text||'Project room is ready.').slice(0,63))}…</p></span>${icon('arrow')}</button>`).join('');if(mobileTab==='documents')return `<div class="filters"><input type="search" placeholder="Project, client or document…" aria-label="Search mobile documents" value="${esc(docQuery)}" oninput="docQuery=this.value;document.getElementById('mobileDocs').innerHTML=mobileDocs()"></div><div id="mobileDocs">${mobileDocs()}</div>`;return state.projects.filter(p=>p.stage===5).map(p=>approvalCard(p,true)).join('')||'<div class="empty">You’re all caught up.<br>No owner approvals pending.</div>'}
function mobileDocs(){return state.docs.filter(d=>documentMatches(d,docQuery)).sort((a,b)=>b.at-a.at).map(d=>`<button class="phone-doc" onclick="previewDoc('${d.id}')"><span class="file-icon">${d.source==='sample'?'DEMO':'FILE'}</span><span class="grow"><b>${esc(d.name)}</b><small>${esc(project(d.project).name)}<br>${d.code}</small></span>${pill('V'+d.version,currentDoc(d)?'green':'')}</button>`).join('')||'<div class="empty">No matching files.</div>'}
function guide(){let cards=[['01 / PROJECT VISIBILITY','Know exactly where every project stands.','Capture the client brief and rough sketch under one project ID. Each stage has a named team member and deadline. The owner sees the current team immediately; stage history retains who passed work, when, and why.','Open Sharma Residence. Complete the Drafting stage with a document and next deadline. Watch the current team change to Structural.',"openProject('p0')",'Try a handoff'],['02 / DOCUMENT RETRIEVAL','Find last year’s work in seconds.','The Project Repository separates ongoing projects from completed projects. Open an ongoing project to see its status and files, or a completed project to browse its retained documents. Documents have stable codes and separate version numbers. Search by project, client, title, code or author. Revisions stay available, and completed projects remain searchable.','Open the library and search “Sharma”. Compare V1 and V2 of the floor layout, or add a file from your computer.',"go('repository')",'Open project repository'],['03 / APPROVAL CONTROL','A clear decision before execution.','Choose owner → client or direct-to-client review for each project. Submission captures an exact document version. Owner approval releases it to the client; client approval releases it to execution. Changes return it to a team with a reason and a new deadline.','Open Verma Café on the mobile approval screen. Review the document and approve. On desktop, record the client decision to release execution.',"mobileTab='approval';go('mobile')",'Review on mobile'],['04 / EMPLOYEE MANAGEMENT','Manage people, workdays and activity.','Open any employee to review daily or monthly work, projects, working time, idle time and screenshot history. Add employees or remove them while preserving their records. Screenshot intervals are configured by the owner.','Open Ravi’s profile to review a sample idle session. Change the screenshot interval, generate a sample capture and inspect it. Switch to Month to view days worked and project totals.',"go('employees')",'Explore employees'],['05 / PROJECT CONVERSATIONS','Keep decisions and files together.','A project room is created with every project, connecting the owner and four teams. Messages and attachments belong to that project. A chat attachment is also a registered library document, so retrieval never depends on scrolling through messages.','Send a message from the desktop, then open the same room in the mobile companion. Attach a file and find it in the library.',"go('chat')",'Open project chat'],['06 / DEMO TO PRODUCTION','Understand what is saved, and where.','This is an offline HTML prototype. Project records, chat, approvals and attendance are saved in this browser’s local storage. Uploaded files are saved in its IndexedDB file store. Sample documents are labeled illustrative content, not actual drawings.','The phone is an interactive preview sharing this browser’s data. Real accounts, cross-device synchronization, notifications and cloud backups belong to the production implementation.',"architectureDialog()",'View proposed architecture']];return title('CLIENT PRESENTATION GUIDE','One connected way to run the studio.','Use these six scenarios to explain the solution, then demonstrate each one.')+`<div class="guide-grid">${cards.map(([n,t,body,tryIt,fn,button])=>`<div class="card guide-card"><div class="number eyebrow">${n}</div><h2>${t}</h2><p>${body}</p><div class="explain"><b>Presentation scenario</b><p>${tryIt}</p></div><button class="btn primary" onclick="${fn}">${button} ${icon('arrow')}</button></div>`).join('')}</div><div class="spacer"></div><div class="explain"><b>Workflow source & assumptions</b><p>Team names and sample staff are taken from the previous Team3 demo. The requested sequential route is the default; revision returns are retained from the earlier demo. The owner records client feedback here; a client login is not included. Approval route is selected at project creation. The employee desktop app would provide manual clock-in/out, activity signals and screenshots only while clocked in. This admin-only demo uses explicitly simulated activity and screenshot examples.</p></div>`}
function modal(title,body){let d=document.getElementById('modal');d.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="btn sm" aria-label="Close dialog" onclick="closeModal()">${icon('close')}</button></div><div class="modal-body">${body}</div>`;if(!d.open)d.showModal()}
function closeModal(){document.getElementById('modal').close()}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){let r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
const actions=(label='Save')=>`<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">${label}</button></div>`;
function newProject(){modal('Start a new project',`<div class="explain">A unique project number, history and shared chat room are created together. Add the rough sketch in the project’s document tab.</div><form onsubmit="createProject(event)"><div class="form-grid"><label>Project name<input name="name" required maxlength="100" placeholder="e.g. Sen Residence"></label><label>Client name<input name="client" required maxlength="100"></label><label class="full">Client requirements / rough sketch brief<textarea name="brief" required maxlength="3000"></textarea></label><label>Owner brief deadline<input name="due" type="date" required value="${relativeDate(2)}"></label><label>Approval route<select name="route"><option value="owner">Owner review → Client review</option><option value="client">Direct client review</option></select></label></div>${actions('Create project')}</form>`)}
function createProject(e){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),client=f.get('client').trim(),brief=f.get('brief').trim();if(!name||!client||!brief)return toast('Enter a project name, client and brief.');let p={id:uid(),no:`T3-${new Date().getFullYear()}-${String(state.next++).padStart(4,'0')}`,name,client,brief,stage:0,route:f.get('route'),due:f.get('due'),priority:'Normal',hold:'',records:[{stage:0,entered:Date.now(),completed:null,owner:'Owner',due:f.get('due')}],history:[],package:null};history(p,'Client brief captured',brief);p.assignees=Object.fromEntries(TEAMS.map(t=>[t,teamEmployee(t)?.id||null]));state.projects.push(p);save();closeModal();openProject(p.id);toast('Project and team chat room created. Add your rough sketch to begin.')}
function moveStage(p,to,due,note,actor='Owner'){let record=p.records.filter(r=>r.stage===p.stage&&!r.completed).at(-1);if(record)record.completed=Date.now();let from=p.stage;p.stage=to;p.due=due;p.hold='';p.records.push({stage:to,entered:Date.now(),completed:null,owner:stageOwner(p),due});history(p,`${STAGES[from]} → ${STAGES[to]}`,note,actor)}
function handoffDialog(id){let p=project(id);if(p.stage>4)return;let next=p.stage===4?(p.route==='owner'?5:6):p.stage+1;let docs=latestDocs(id).filter(d=>p.stage===0?true:d.team===TEAMS[p.stage-1]);modal(p.stage===4?'Submit the design for review':'Complete stage & hand off',`<div class="explain"><b>${STAGES[p.stage]} → ${STAGES[next]}</b><p>Completion, document, next responsible person and new deadline will be recorded in the project history.</p></div>${p.hold?'<p class="text-red">Resolve the recorded blocker under “Deadline & blocker” before handing off.</p>':''}<form onsubmit="submitHandoff(event,'${id}')"><div class="form-grid"><label class="full">Completed deliverable<select name="doc" required><option value="">Choose a current document</option>${docs.map(d=>`<option value="${d.id}">${esc(d.name)} · V${d.version}</option>`).join('')}</select></label>${!docs.length?`<div class="full explain">Add a ${p.stage===0?'rough sketch':TEAMS[p.stage-1]+' deliverable'} first. <button type="button" class="text-link" onclick="uploadDialog('${id}')">Add document</button></div>`:''}<label>Next responsible person${next<5?'<select name="assignee" required>'+employeeOptions(TEAMS[next-1],p.assignees?.[TEAMS[next-1]])+'</select>':'<input readonly value="'+esc(next===6?p.client:'Owner')+'">'}</label><label>Next stage deadline<input name="due" type="date" required min="${today()}" value="${relativeDate(3)}"></label><label class="full">Handoff notes<textarea name="note" required maxlength="2000" placeholder="What is complete? What should the next person know?"></textarea></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" ${p.hold||!docs.length?'disabled':''}>${p.stage===4?'Submit for review':'Complete & hand off'}</button></div></form>`)}
function submitHandoff(e,id){e.preventDefault();let p=project(id),f=new FormData(e.target),d=state.docs.find(d=>d.id===f.get('doc')),note=f.get('note').trim();if(p.stage>4||p.hold||!note||!d||d.project!==id||!currentDoc(d)||(p.stage>0&&d.team!==TEAMS[p.stage-1]))return toast('Select a current deliverable and resolve blockers first.');let next=p.stage===4?(p.route==='owner'?5:6):p.stage+1;if(next<5){let assignee=employeeById(f.get('assignee'));if(!assignee?.active||assignee.team!==TEAMS[next-1])return toast('Select an active employee in the receiving team.');p.assignees[TEAMS[next-1]]=assignee.id}if(p.stage===4)p.package=d.id;moveStage(p,next,f.get('due'),`${note} Deliverable: ${d.code} · V${d.version}.`,stageOwner(p));save();closeModal();render();toast('Stage completed. Responsibility and deadline updated.')}
function deadlineDialog(id){let p=project(id);modal('Deadline & dependency',`<form onsubmit="saveDeadline(event,'${id}')"><div class="form-grid"><label>Stage deadline<input name="due" type="date" required value="${p.due}"></label><label>Responsible member<input readonly value="${esc(stageOwner(p))}"></label><label class="full">Blocker / dependency (clear when resolved)<textarea name="hold" maxlength="2000">${esc(p.hold)}</textarea></label><label class="full">Reason for this update<textarea name="note" required maxlength="2000" placeholder="Explain the deadline change or blocker resolution."></textarea></label></div>${actions('Save stage update')}</form>`)}
function saveDeadline(e,id){e.preventDefault();let f=new FormData(e.target),p=project(id),note=f.get('note').trim();if(!note)return toast('A reason is required.');history(p,'Deadline / blocker updated',`Deadline ${p.due} → ${f.get('due')}. ${note} ${f.get('hold').trim()?'Blocker: '+f.get('hold').trim():'No active blocker.'}`);p.due=f.get('due');p.hold=f.get('hold').trim();let r=p.records.filter(r=>r.stage===p.stage).at(-1);if(r)r.due=p.due;save();closeModal();render();toast('Update saved in the project history.')}
function revisionDialog(id){let p=project(id);modal('Request a revision',`<div class="explain">This returns responsibility to a design team. Later stages must be completed again, and the revised submission requires fresh approval. Earlier decisions remain in history.</div><form onsubmit="requestRevision(event,'${id}')"><div class="form-grid"><label>Return to team<select name="stage">${TEAMS.slice(0,Math.min(p.stage,4)).map((t,i)=>`<option value="${i+1}" ${i===Math.min(3,p.stage-2)?'selected':''}>${t} · ${esc(teamEmployee(t)?.name||'No active employee')}</option>`).join('')}</select></label><label>Revision deadline<input type="date" name="due" min="${today()}" value="${relativeDate(2)}" required></label><label class="full">Required changes / reason<textarea name="note" required maxlength="2000"></textarea></label></div>${actions('Send for revision')}</form>`)}
function requestRevision(e,id){e.preventDefault();let f=new FormData(e.target),p=project(id),note=f.get('note').trim();if(!note)return toast('Describe the changes required.');let to=Number(f.get('stage'));if(to>Math.min(p.stage,4))return toast('Choose the current or an earlier team.');let receiver=teamEmployee(TEAMS[to-1]);if(!receiver)return toast('Add an active employee to the receiving team first.');p.assignees[TEAMS[to-1]]=receiver.id;let old=p.stage;moveStage(p,to,f.get('due'),'Revision requested: '+note);p.package=null;for(let i=to+1;i<=7;i++)if(p.records.some(r=>r.stage===i)){p.records.push({stage:i,entered:null,completed:null,owner:i<5?(teamEmployee(TEAMS[i-1])?.name||'Unassigned'):'Owner',due:null})}history(p,'Approval cycle reopened',`Previous ${STAGES[old]} submission no longer authorizes execution.`);save();closeModal();render();toast('Revision assigned. A fresh approval cycle is required.')}
function approveDialog(id){let p=project(id),d=state.docs.find(d=>d.id===p.package);if(p.stage!==5||!d||!currentDoc(d))return toast('The submission has changed. Please resubmit the current version.');modal('Approve for client review',`<div class="explain"><b>${esc(p.name)}</b><p>${esc(d.name)} · V${d.version}<br>${d.code}</p></div><form onsubmit="approveOwner(event,'${id}','${d.id}')"><label>Client response deadline<input name="due" type="date" required min="${today()}" value="${relativeDate(3)}"></label><label style="margin-top:16px">Review note<textarea name="note" maxlength="2000" placeholder="Optional note for the client submission"></textarea></label>${actions('Approve & release to client')}</form>`)}
function approveOwner(e,id,docId){e.preventDefault();let p=project(id),d=state.docs.find(d=>d.id===docId);if(p.stage!==5||p.package!==docId||!d||!currentDoc(d))return toast('Submission changed. Refresh the review.');let f=new FormData(e.target);moveStage(p,6,f.get('due'),`Owner approved ${d.code} · V${d.version}. ${f.get('note').trim()}`);save();closeModal();render();toast('Approved. Client sign-off is now required before execution.')}
function clientDecision(id){let p=project(id);modal('Record the client’s decision',`<div class="explain"><b>Demo: the owner records client feedback.</b><p>This does not send a message to the client. Record the decision and its reference against the submitted document.</p></div><form onsubmit="saveClientDecision(event,'${id}')"><div class="form-grid"><label>Decision<select name="decision"><option value="approved">Approved for execution</option><option value="changes">Changes requested</option></select></label><label>Next deadline<input name="due" type="date" required min="${today()}" value="${relativeDate(7)}"></label><label class="full">Client feedback / approval reference<textarea required name="note" maxlength="2000" placeholder="e.g. Client approved by email on 23 September, reference…"></textarea></label></div>${actions('Record decision')}</form>`)}
function saveClientDecision(e,id){e.preventDefault();let p=project(id),f=new FormData(e.target),note=f.get('note').trim(),d=state.docs.find(d=>d.id===p.package);if(!note||p.stage!==6||!d||!currentDoc(d))return toast('A valid current submission and decision reference are required.');let approved=f.get('decision')==='approved';moveStage(p,approved?7:4,f.get('due'),`${approved?'Client approved':'Client requested changes'} ${d.code} · V${d.version}. ${note}`,'Owner · client decision recorded');if(!approved){p.package=null;p.records.push({stage:5,entered:null,completed:null,owner:'Owner',due:null},{stage:6,entered:null,completed:null,owner:p.client,due:null})}save();closeModal();render();toast(approved?'Client sign-off recorded. Project released to execution.':'Returned to Visualizer for revision.')}

// ponytail: files are device-local IndexedDB blobs; production replaces this with authenticated object storage.
function fileDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('team3-demo-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function storeBlob(id,blob){let db=await fileDB();return new Promise((resolve,reject)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function getBlob(id){let db=await fileDB();return new Promise((resolve,reject)=>{let r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>{db.close();resolve(r.result)};r.onerror=()=>{db.close();reject(r.error)}})}
async function addDocument(e,fromChat){e.preventDefault();let f=new FormData(e.target),p=project(f.get('project')),prev=state.docs.find(d=>d.id===f.get('previous')),file=f.get('file'),sample=f.get('sample')==='on',name=(f.get('name')||'').trim();if(!prev&&!name)return toast('Enter a document title.');if(!sample&&(!file||!file.size))return toast('Choose a file or select illustrative sample.');if(!sample&&file.size>15*1024*1024)return toast('Please choose a file smaller than 15 MB.');let team=prev?.team||f.get('team'),n=state.docs.filter(d=>d.project===p.id&&d.team===team).reduce((n,d)=>Math.max(n,Number(d.code.split('-').at(-1))||0),0)+1;let d={id:uid(),project:p.id,team,code:prev?.code||`${p.no}-${CODES[TEAMS.indexOf(team)]}-${String(n).padStart(3,'0')}`,name:prev?.name||name,version:prev?Math.max(...state.docs.filter(x=>x.code===prev.code).map(x=>x.version))+1:1,by:'Owner',at:Date.now(),source:sample?'sample':'upload',original:sample?'Illustrative sample.txt':file.name};let submit=e.target.querySelector('button[type=submit]');if(submit)submit.disabled=true;try{if(!sample)await storeBlob(d.id,file)}catch{if(submit)submit.disabled=false;return toast('File could not be saved. Browser storage may be unavailable or full.')}state.docs.push(d);history(p,prev?'Document revision saved':'Document registered',`${d.code} · V${d.version} · ${d.name}`,d.by);if(prev&&p.package&&state.docs.find(x=>x.id===p.package)?.code===d.code&&p.stage>=5&&p.stage<=7){moveStage(p,4,relativeDate(2),'A new submitted-document version invalidated the prior review. Resubmission required.');p.package=null;[5,6,7].forEach(stage=>p.records.push({stage,entered:null,completed:null,owner:'Owner',due:null}))}if(fromChat)state.messages.push({id:uid(),project:p.id,by:'Owner',at:Date.now(),text:'Shared a project document.',doc:d.id});save();closeModal();render();toast(fromChat?'Attachment sent and registered in the library.':'Document saved with its project code and version.')}
function sampleText(d){let p=project(d.project);return `TEAM3 ASSOCIATES\nILLUSTRATIVE DEMO DOCUMENT — NOT A CONSTRUCTION DRAWING\n\n${d.name}\n${d.code} · V${d.version}\nProject: ${p.name}\nClient: ${p.client}\nTeam: ${d.team}\nAuthor: ${d.by}\n\nClient requirements\n${p.brief}\n\nRevision note\n${d.version>1?'Updated furniture arrangement following review. Earlier revisions remain in the library.':'Initial design concept for discussion and review.'}\n\nThis sample demonstrates document retrieval, version control and approvals. Replace with actual design files in production.`}
async function previewDoc(id){let d=state.docs.find(d=>d.id===id);if(!d)return toast('Document not found.');let versions=state.docs.filter(x=>x.code===d.code).sort((a,b)=>b.version-a.version);modal('Document details',`<div class="flex between wrap" style="margin-bottom:18px">${pill('V'+d.version+' · '+(currentDoc(d)?'Current':'Superseded'),currentDoc(d)?'green':'')}<small>${d.code}</small></div><div id="filePreview" class="doc-preview">${d.source==='sample'?`<div class="eyebrow text-green">ILLUSTRATIVE DEMO DOCUMENT</div><h2>${esc(d.name)}</h2><b>${esc(project(d.project).name)}</b><p>${esc(project(d.project).brief)}</p><p>${d.version>1?'Updated furniture arrangement following review. Earlier revisions remain available.':'Initial design concept for discussion and review.'}</p><small>This sample is not an actual design drawing. Upload a real file to demonstrate file preview and download.</small>`:'Loading the locally saved file…'}</div><div class="flex wrap" style="margin-top:18px"><b>Version history</b>${versions.map(v=>`<button class="btn sm" onclick="previewDoc('${v.id}')">V${v.version}${v.id===id?' · viewing':''}</button>`).join('')}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="downloadDoc('${id}')">Download ${d.source==='sample'?'sample':'file'}</button></div>`);if(d.source!=='sample'){try{let blob=await getBlob(id),el=document.getElementById('filePreview');if(!el)return;if(!blob){el.textContent='This file is unavailable in this browser. Re-upload the original file.';return}let url=URL.createObjectURL(blob);if(['image/png','image/jpeg','image/webp','image/gif'].includes(blob.type))el.innerHTML=`<img alt="Uploaded project document" src="${url}" style="max-width:100%;max-height:380px;display:block;margin:auto">`;else if(blob.type==='application/pdf')el.innerHTML=`<iframe title="Project PDF" src="${url}" style="width:100%;height:380px;border:0"></iframe>`;else el.innerHTML=`<h2>${esc(d.original)}</h2><p>This file type opens in its desktop application. Use Download file to retrieve the saved original.</p>`;document.getElementById('modal').addEventListener('close',()=>URL.revokeObjectURL(url),{once:true})}catch{document.getElementById('filePreview').textContent='Unable to access browser file storage.'}}}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function architectureDialog(){modal('Proposed production solution',`<div class="explain"><b>This is the implementation plan, not a claim that the demo is cloud-connected.</b></div><div class="architecture"><div>Desktop workspace<br>Full operations</div><span>↔</span><div>Authenticated application API</div><span>↔</span><div>Mobile companion<br>Chat · files · approvals</div></div><h3>How records would be stored</h3><p style="margin:9px 0 18px">A central database stores project IDs, clients, assignments, stage visits, deadlines, approval decisions, chat messages and clock sessions. Private object storage holds original drawings and versioned files. A document index connects file IDs to project names and codes for fast search.</p><h3>How people stay in sync</h3><p style="margin:9px 0 18px">Both apps read the same API. New messages and workflow events update connected screens and trigger notifications for assignments, overdue stages and approval requests. File access uses authenticated, expiring links.</p><h3>How access and history would work</h3><p style="margin:9px 0 18px">Owner: all projects, assignments, reports and approvals. Team members: assigned work, shared project rooms and their own clock sessions. The server enforces permissions, generates unique IDs, prevents duplicate clock-ins and retains an append-only event history. Client sign-off is recorded by the owner unless a client portal is added later.</p><h3>Employee activity and screenshots</h3><p style="margin:9px 0 18px">A separate employee desktop app provides manual clock-in/out, working and idle signals, and screen captures at the admin’s configured interval. The employee sees when capture is enabled. Capture stops at clock-out. Images are stored privately with employee, project and session IDs; only authorized admins can review them. This HTML demonstrates settings and sample capture history; it does not capture employee desktops. Idle time is an activity signal, not a productivity score.</p><h3>Retention and recovery</h3><p style="margin:9px 0 18px">Document versions are retained rather than overwritten. Scheduled database backups and object-version recovery protect old projects. Retention duration, hosting location, user roles and notification channels are confirmed before production deployment.</p><h3>What this HTML already demonstrates</h3><p style="margin:9px 0">Sequential handoff and revisions, searchable version history, local file upload/download, owner/client approval gates, project rooms, timestamp-based attendance and downloadable reports. Local demo storage can be cleared by browser settings; it is not a business backup.</p>`)}

function assignEmployee(event,id){event.preventDefault();let p=project(id),f=new FormData(event.target),e=employeeById(f.get('employee')),note=f.get('note').trim();if(p.stage<1||p.stage>4||!e?.active||e.team!==TEAMS[p.stage-1]||!note)return toast('Choose an active employee from this team and enter a note.');let previous=stageOwner(p);p.assignees[TEAMS[p.stage-1]]=e.id;let record=p.records.filter(r=>r.stage===p.stage&&r.entered&&!r.completed).at(-1);if(record)record.owner=e.name;history(p,'Stage responsibility reassigned',`${previous} → ${e.name}. ${note}`);save();closeModal();render();toast('Stage responsibility updated and recorded in history.')}
function initializeWorkforce(){
  if(!state.employees)state.employees=PEOPLE.map((name,i)=>({id:'emp-'+(i+1),code:'T3-E'+String(i+1).padStart(3,'0'),name,team:TEAMS[i],email:['priya','arun','ravi','meena'][i]+'@team3.example',active:true,joined:relativeDate(-90)}));
  state.employeeEvents??=[];state.captures??=[];state.capturePolicy??={enabled:true,intervalMinutes:15,idleMinutes:5};
  for(const p of state.projects)p.assignees??=Object.fromEntries(TEAMS.map(t=>[t,teamEmployee(t)?.id||null]));
  // Migrate the earlier browser demo without replacing its projects or clock records.
  if(!state.workforceVersion){
    for(let i=0;i<4;i++)for(let offset=2;offset<=9;offset++){let d=new Date();d.setDate(d.getDate()-offset);d.setHours(9,0,0,0);if(d.getDay()===0||d.getDay()===6)continue;state.sessions.push({id:uid(),employee:PEOPLE[i],project:'p'+i,start:d.getTime(),end:d.getTime()+(7.2+i*.2)*3600000,source:'sample'})}
    for(const s of state.sessions){s.employeeId??=state.employees.find(e=>e.name===s.employee)?.id;s.source??='sample';let end=s.end??Date.now(),span=end-s.start;
      if(!s.activity){const idleStart=s.start+span*.45,idleEnd=idleStart+span*.1;s.activity=[{kind:'working',start:s.start,end:idleStart},{kind:'idle',start:idleStart,end:idleEnd},{kind:'working',start:idleEnd,end:s.end}];if(s.end===null&&s.employeeId==='emp-3'){let idleAt=Math.max(s.activity.at(-1).start,end-10*60000);s.activity.at(-1).end=idleAt;s.activity.push({kind:'idle',start:idleAt,end:null})}}
      s.lastCaptureAt=Date.now();
      if(s.employeeId&&s.end!==null){let at=s.start+Math.min(45*60000,span*.5);state.captures.push({id:uid(),employeeId:s.employeeId,sessionId:s.id,project:s.project,at,activity:'working',intervalMinutes:15,source:'sample'})}
      if(s.employeeId&&s.end===null)for(const mins of [30,15,5]){let at=Date.now()-mins*60000;if(at>=s.start)state.captures.push({id:uid(),employeeId:s.employeeId,sessionId:s.id,project:s.project,at,activity:activityAt(s,at),intervalMinutes:15,source:'sample'})}
    }
    state.workforceVersion=1;save();
  }
  for(const s of state.sessions){s.employeeId??=state.employees.find(e=>e.name===s.employee)?.id;s.activity??=[{kind:'unknown',start:s.start,end:s.end}];s.lastCaptureAt??=Date.now()}
}
function activityAt(session,at=Date.now()){return session.activity?.findLast(a=>a.start<=at&&(a.end===null||a.end>at))?.kind||'unknown'}
function employeeLive(e){if(!e.active)return 'Removed';let s=employeeSession(e.id);return !s?'Clocked out':activityAt(s)==='idle'?'Idle':activityAt(s)==='working'?'Working':'Activity unavailable'}
function employeeBadge(e){let status=employeeLive(e);return pill(status,status==='Working'?'green':status==='Idle'?'amber':'')}
function periodBounds(){if(workPeriod==='day')return dayBounds(workDate);let a=new Date(workMonth+'-01T00:00:00'),b=new Date(a);b.setMonth(b.getMonth()+1);return [+a,+b]}
function periodTitle(){return workPeriod==='day'?new Date(workDate+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}):new Date(workMonth+'-01T12:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})}
function employeeSessions(id,a,b){return state.sessions.filter(s=>s.employeeId===id&&s.start<b&&(s.end??Date.now())>a)}
function activityMetrics(id,a,b){let sessions=employeeSessions(id,a,b),total=0,working=0,idle=0;for(const s of sessions){total+=sessionHours(s,a,b);for(const part of s.activity||[]){let hours=sessionHours({start:Math.max(part.start,s.start),end:Math.min(part.end??Date.now(),s.end??Date.now())},a,b);if(part.kind==='working')working+=hours;if(part.kind==='idle')idle+=hours}}
  let days=new Set();for(const s of sessions){let day=new Date(Math.max(s.start,a));day.setHours(0,0,0,0);while(+day<Math.min(s.end??Date.now(),b)){let next=new Date(day);next.setDate(next.getDate()+1);if(sessionHours(s,Math.max(a,+day),Math.min(b,+next))>0)days.add(localDate(day));day=next}}
  return {total,working,idle,unknown:Math.max(0,total-working-idle)<1e-7?0:Math.max(0,total-working-idle),days:days.size,sessions};
}

function employeeManagement(){let members=state.employees.filter(e=>e.active),[a,b]=periodBounds();return title('PEOPLE & OPERATIONS','Employee Management','People, work records and activity evidence in one admin workspace.',`<button class="btn" onclick="captureSettingsDialog()">${icon('attendance')}Screenshot settings</button><button class="btn primary" onclick="addEmployeeDialog()">${icon('plus')}Add employee</button>`)+`<div class="stats">${stat('Active employees',members.length,'Across all four teams','employees')}${stat('Working now',members.filter(e=>employeeLive(e)==='Working').length,'Simulated employee activity','dashboard')}${stat('Idle now',members.filter(e=>employeeLive(e)==='Idle').length,'Clocked in with an idle signal','attendance')}${stat('Recorded hours',state.employees.reduce((n,e)=>n+activityMetrics(e.id,a,b).total,0).toFixed(1),periodTitle(),'reports')}</div><div class="card"><div class="card-head wrap"><div><h2>Employee directory</h2><small>Choose a person to inspect work, projects and screenshots.</small></div>${periodControls()}</div><div class="filters"><input type="search" aria-label="Search employees" placeholder="Search employee, ID or team…" value="${esc(employeeQuery)}" oninput="employeeQuery=this.value;refreshEmployeeList()"><select aria-label="Employee status filter" onchange="employeeStatusFilter=this.value;refreshEmployeeList()"><option value="active" ${employeeStatusFilter==='active'?'selected':''}>Active employees</option><option value="removed" ${employeeStatusFilter==='removed'?'selected':''}>Removed employees</option><option value="all" ${employeeStatusFilter==='all'?'selected':''}>All records</option></select><button class="btn" onclick="exportEmployeeReport()">Export work report</button></div><div id="employeeResults">${employeeTable()}</div></div><div class="spacer"></div><div class="capture-policy-strip"><div class="flex"><span class="project-icon">${icon('documents')}</span><div><b>${state.capturePolicy.enabled?'Screenshot policy enabled':'Screenshot policy paused'}</b><p class="muted">${state.capturePolicy.enabled?'Every '+captureIntervalLabel()+' · only during a clocked-in session':'Existing captures stay available for review.'}</p></div></div><button class="btn" onclick="captureSettingsDialog()">Manage policy</button></div><div class="spacer"></div><div class="explain"><b>Admin view · demonstration activity.</b><p>Employees would manually clock in and out in their own desktop app. This screen receives their work sessions, working/idle signals and screenshots. The current demo uses simulated records and labeled sample captures; it does not monitor anyone’s computer.</p></div>`}
